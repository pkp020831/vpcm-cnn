[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ml-ep"
version = "0.1.0"
description = "Equilibrium Propagation (EqProp) framework with PyTorch Lightning and Hydra"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # --------- pytorch ---------
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "lightning>=2.0.0",
    "torchmetrics>=0.11.4",
    # --------- hydra ---------
    "hydra-core==1.3.4",
    "hydra-colorlog==1.2.0",
    "hydra-optuna-sweeper==1.2.0",
    # --------- loggers ---------
    "wandb",
    # --------- others ---------
    "rootutils",
    "pre-commit",
    "rich",
    "pytest",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pre-commit",
    "rich",
]

[tool.pytest.ini_options]
addopts = [
  "--color=yes",
  "--durations=0",
  "--strict-markers",
  "--doctest-modules",
]
filterwarnings = [
  "ignore::DeprecationWarning",
  "ignore::UserWarning",
]
log_cli = "True"
markers = [
  "slow: slow tests",
]
minversion = "6.0"
testpaths = "tests/"

[tool.coverage.report]
exclude_lines = [
    "pragma: nocover",
    "raise NotImplementedError",
    "raise NotImplementedError()",
    "if __name__ == .__main__.:",
]

[tool.hatch.build.targets.wheel]
  packages = ["src", "configs"]