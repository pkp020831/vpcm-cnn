# @package model.net
_target_: src._eqprop.EqPropBackbone
beta: 0.1
bias: false
scale_input: 2
scale_output: 2
cfg:
  - 1568  # 784 * 2
  - 128
  - 20    # 10 * 2

solver:
  _target_: src.core.eqprop.solvers.AnalogEqPropSolver
  amp_factor: 1.0
  beta: 0.1
  strategy:
    _target_: src.core.eqprop.strategy.ResistiveNetworkStrategy  #src.core.eqprop.strategy.NewtonStrategy
    amp_factor: ${...solver.amp_factor}
    activation:
      _target_: src.core.eqprop.activation.OTS
      Is: 1e-6
      Vth: 0.026
      Vl: 0.1
      Vr: 0.9

param_adjuster:
  _target_: src.utils.eqprop_utils.AdjustParams
