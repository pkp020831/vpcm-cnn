# @package model.net
# 기존 ep_mnist의 설정(cfg 등)을 그대로 상속받습니다.
defaults:
  - ep_mnist
  - _self_

# 1. _target_을 새로 만든 ResidualEqPropBackbone으로 변경합니다.
_target_: src._eqprop.backbone.ResidualEqPropBackbone

# 2. 새로운 'shortcuts' 파라미터를 추가합니다.
shortcuts:
  # base_scale은 원하시는 값으로 수정하여 사용하세요.
  # 이 값은 내부적으로 'base_scale / sqrt(depth)'로 계산되어 적용됩니다.
  - [0, 1, 1.0]  # Hidden Layer 0 -> 1, base_scale = 1.0
  - [1, 2, 1.0]  # Hidden Layer 1 -> 2, base_scale = 1.0
