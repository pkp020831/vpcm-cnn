# @package _global_

# specify experiment name
name: "Ffwd_Activity_Norm_vs_Depth_EPB"

defaults:
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null

data:
  _target_: src.data.fashion_mnist_datamodule.FashionMNISTDataModule
  data_dir: "data/"
  batch_size: 1

model:
  _target_: src.models.mnist_module.MNISTLitModule
  compile: false
  optimizer:
    _target_: torch.optim.AdamW
    _partial_: true
    lr: 0.001
  scheduler:
    _target_: torch.optim.lr_scheduler.ReduceLROnPlateau
    _partial_: true
    mode: "min"
  net:
    beta: 1.5
    res_scale: 1
    solver:
      _target_: src.core.eqprop.solvers.AnalogEqPropSolver
      amp_factor: 0
      beta: 1.5
      
seed: 12347

# Analysis-specific parameters
analysis:
  input_size: 784
  output_size: 10
  width: 64
  depths: [8, 16, 32, 64, 128, 256, 512]
  n_seeds: 3

# Disable all loggers
logger:
  aim: null
  comet: null
  csv: null
  json: null
  mlflow: null
  neptune: null
  tensorboard: null
  wandb: null
