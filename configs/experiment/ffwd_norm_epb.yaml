# @package _global_

# specify experiment name
name: "Ffwd_Activity_Norm_vs_Depth_EPB"

defaults:
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null

data:
  _target_: src.data.mnist_datamodule.MNISTDataModule
  data_dir: "data/"
  batch_size: 1

model:
  _target_: src.models.mnist_module.MNISTLitModule
  compile: false
  optimizer:
    _target_: torch.optim.AdamW
    _partial_: true
    lr: 0.001
  scheduler:
    _target_: torch.optim.lr_scheduler.ReduceLROnPlateau
    _partial_: true
    mode: "min"
  net:
    _target_: src._eqprop.backbone.EqPropBackbone
    beta: 1.5
    residual: false
    res_scale: 0.1
    
    solver:
      _target_: src.core.eqprop.solvers.AnalogEqPropSolver
      amp_factor: 0
      beta: 1.5
      strategy:
        _target_: src.core.eqprop.strategy.strategies.ProxQPStrategy
        rtol: 1.0e-5
        amp_factor: 0
        activation:
          _target_: src.core.eqprop.activation.IdealRectifier

seed: 12347

# Analysis-specific parameters
analysis:
  input_size: 784
  output_size: 10
  width: 8
  depths: [8, 16, 32, 64, 128, 256, 512]
  n_seeds: 1
  # Combinations of parameters to plot
  param_combinations:
    - name: "orthogonal"
      params: {initialization: "orthogonal"}
    - name: "default"
      params: {initialization: "default"}
    - name: "gaussian_var1"
      params: {initialization: "gaussian", init_variance: 1.0}
    - name: "gaussian_var_1_over_width"
      params: {initialization: "gaussian", init_variance: 0.0078125}

# Disable all loggers
logger:
  aim: null
  comet: null
  csv: null
  json: null
  mlflow: null
  neptune: null
  tensorboard: null
  wandb: null
